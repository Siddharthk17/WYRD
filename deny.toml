[advisories]
yanked = "warn"
unmaintained = "workspace"
unsound = "workspace"

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    # Weak copyleft, file scope. Allowed because the charter pins imbl 7
    # as the persistent-map implementation for anvil-kv snapshots (O(1)
    # clone) and anvil-check test utilities. See docs/progress/week4.md.
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version requirement by construction;
# they resolve to the local crate, never to a floating registry range.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
