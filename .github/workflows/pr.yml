name: PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci-x86_64:
    name: CI (x86_64 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          TOOLCHAIN=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup toolchain install nightly --profile minimal
          rustup default "$TOOLCHAIN"
          df -h "$HOME"
          rustup component add rustfmt --toolchain "$TOOLCHAIN"
          rustup component add clippy --toolchain "$TOOLCHAIN"
          rustup component add llvm-tools-preview --toolchain "$TOOLCHAIN"
          test -x "$(rustc --print sysroot)/bin/llvm-profdata"
          rustup show

      - name: Install Java for TLC
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download tla2tools.jar
        run: |
          mkdir -p tools
          curl -sSL -o tools/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar

      - name: Install CI tools
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9,cargo-hack@0.6,cargo-deny@0.20,cargo-audit@0.22,cargo-geiger@0.14,cargo-llvm-cov@0.9,cargo-fuzz@0.13

      - name: ANVIL Quality Gates (xtask ci)
        run: cargo xtask ci

  ci-aarch64:
    name: CI (aarch64 Linux)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          TOOLCHAIN=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup toolchain install nightly --profile minimal
          rustup default "$TOOLCHAIN"
          df -h "$HOME"
          rustup component add rustfmt --toolchain "$TOOLCHAIN"
          rustup component add clippy --toolchain "$TOOLCHAIN"
          rustup component add llvm-tools-preview --toolchain "$TOOLCHAIN"
          test -x "$(rustc --print sysroot)/bin/llvm-profdata"
          rustup show

      - name: Install Java for TLC
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download tla2tools.jar
        run: |
          mkdir -p tools
          curl -sSL -o tools/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar

      - name: Install CI tools
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9,cargo-hack@0.6,cargo-deny@0.20,cargo-audit@0.22,cargo-geiger@0.14,cargo-llvm-cov@0.9,cargo-fuzz@0.13

      - name: ANVIL Quality Gates (xtask ci)
        run: cargo xtask ci
