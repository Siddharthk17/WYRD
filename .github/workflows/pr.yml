name: PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci-x86_64:
    name: CI (x86_64 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show

      - name: ANVIL Quality Gates (xtask ci)
        run: cargo xtask ci

  ci-aarch64:
    name: CI (aarch64 Linux)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show

      - name: ANVIL Quality Gates (xtask ci)
        run: cargo xtask ci
