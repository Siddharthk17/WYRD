name: PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci-x86_64:
    name: CI (x86_64 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          TOOLCHAIN=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup toolchain install nightly --profile minimal
          rustup default "$TOOLCHAIN"
          rustup component add rustfmt --toolchain "$TOOLCHAIN"
          rustup component add clippy --toolchain "$TOOLCHAIN"
          SYSROOT=$(rustc --print sysroot)
          HOST_TRIPLE=$(rustc -vV | grep '^host' | cut -d' ' -f2)
          LLVM_BIN="$SYSROOT/lib/rustlib/${HOST_TRIPLE}/bin"
          if [ ! -x "$LLVM_BIN/llvm-profdata" ]; then
            echo "llvm-tools-preview missing for $TOOLCHAIN; installing from the release manifest"
            MANIFEST=$(curl -sSL "https://static.rust-lang.org/dist/channel-rust-${TOOLCHAIN}.toml")
            SECTION=$(echo "$MANIFEST" | grep -A6 "^\[pkg\.llvm-tools-preview\.target\.${HOST_TRIPLE}\]$")
            XZ_URL=$(echo "$SECTION" | grep '^xz_url' | cut -d'"' -f2)
            XZ_HASH=$(echo "$SECTION" | grep '^xz_hash' | cut -d'"' -f2)
            test -n "$XZ_URL"
            test -n "$XZ_HASH"
            curl -sSL -o /tmp/llvm-tools.tar.xz "$XZ_URL"
            echo "$XZ_HASH  /tmp/llvm-tools.tar.xz" | sha256sum -c -
            rm -rf /tmp/llvm-tools-install
            mkdir -p /tmp/llvm-tools-install
            tar -xJf /tmp/llvm-tools.tar.xz -C /tmp/llvm-tools-install
            /tmp/llvm-tools-install/llvm-tools-*/install.sh --prefix="$SYSROOT"
            rm -rf /tmp/llvm-tools.tar.xz /tmp/llvm-tools-install
          fi
          test -x "$LLVM_BIN/llvm-profdata"
          test -x "$LLVM_BIN/llvm-cov"
          rustup show

      - name: Install Java for TLC
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download tla2tools.jar
        run: |
          mkdir -p tools
          curl -sSL -o tools/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar

      - name: Install CI tools
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9,cargo-hack@0.6,cargo-deny@0.20,cargo-audit@0.22,cargo-geiger@0.14,cargo-llvm-cov@0.9,cargo-fuzz@0.13

      - name: ANVIL Quality Gates (xtask ci)
        run: cargo xtask ci

  ci-aarch64:
    name: CI (aarch64 Linux)
    runs-on: ubuntu-24.04-arm
    steps:
