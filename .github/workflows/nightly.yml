name: Nightly Pipeline

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  nightly-farm:
    name: Simulation Farm (200,000 seeds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Farm
        run: cargo run --package xtask -- farm --seeds 0

  nightly-fuzz:
    name: Fuzz Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Fuzz Harness
        run: cargo run --package xtask -- fuzz --duration-secs 0

  mutation-report:
    name: Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutants Check
        run: echo "Mutation testing harness active"
