[package]
name = "anvil-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["sim"]
sim = []
# Hand-authored mutation library. Off in every release gate; `cargo xtask
# mutant` builds with it to run the kill matrix.
mutants = ["anvil-types/mutants", "anvil-raft/mutants", "anvil-kv/mutants", "anvil-storage/mutants", "anvil-node/mutants"]

[dependencies]
anvil-types = { workspace = true }
anvil-raft = { workspace = true }
anvil-storage = { workspace = true }
anvil-kv = { workspace = true }
anvil-check = { workspace = true }
anvil-node = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
rand_chacha = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
crc32c = { workspace = true }

[lints]
workspace = true
